<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body {
            background: rgb(34, 34, 34);
        }

        div h1 {
            justify-content: center;
            margin-top: 5px;
            margin-left: 450px;
            font-size: 100px;
            padding: 20px;
            color: rgb(174, 173, 173);
            font-style: normal;
            font-family: system-ui, sans-serif;
            font-weight: lighter;
        }

        #elem h1 {
            margin-left: 340px;
            font-size: 100px;
            margin-top: -100px;
            color: rgb(0, 0, 0);
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        #login {

            border: 2px solid black;
            background-color: black;
            border-radius: 10px;
            font-size: 40px;
            margin: 490px;
            padding: 220px;
            margin-top: -40px;
        }

        #login h1 {
            font-size: 40px;
            text-align: center;
            position: absolute;
            left: 200px;
            top: 320px;
        }

        hr {
            width: 430px;
            position: absolute;
            left: 520px;
            top: 390px;
        }

        form #email {
            border: 2px solid rgb(40, 39, 39);
            background-color: rgb(52, 51, 51);
            border-radius: 10px;
            position: absolute;
            left: 580px;
            top: 450px;
            width: 300px;
            height: 45px;
            font-size: 20px;
        }

        form #name {
            border: 2px solid rgb(40, 39, 39);
            background-color: rgb(52, 51, 51);
            border-radius: 10px;
            position: absolute;
            left: 580px;
            top: 520px;
            width: 300px;
            height: 40px;
            font-size: 20px;
        }

        form #password {
            border: 2px solid rgb(40, 39, 39);
            background-color: rgb(52, 51, 51);
            border-radius: 10px;
            position: absolute;
            left: 580px;
            top: 590px;
            width: 300px;
            height: 40px;
            font-size: 20px;
        }

        form #but {
            background-color: rgb(14, 14, 14);
            color: white;
            border-radius: 10px;
            height: 55px;
            width: 150px;
            position: absolute;
            top: 660px;
            right: 660px;
        }
    </style>
</head>

<body>
    <div class="back">
        <h1>WEB LOGIN</h1>
    </div>
    <div id="elem">
        <h1>E L E M E N T S</h1>
    </div>
    <div id="login">
        <h1>Sign up</h1>
        <br>
        <hr>
        <div id="Regist">
            <form action="submit">
                <input type="email" id="email" name="email" placeholder="📩 Email Id" required>
                <input type="text" id="name" name="name" placeholder="👨‍💻 Username" required>
                <input type="password" id="password" name="pass" placeholder="🔓 Password" required>
                <button id="but" type="submit">Sign up</button>
            </form>
        </div>
        <p id="para" style="color: white; font-size: 20px; position: absolute; top: 730px; left: 610px;">
            Already have an account? <b>Sign in</b>
        </p>
</body>

</html>
