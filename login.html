<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive forms</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="backg">
        <h1>WEB LOGIN</h1>
    </div>
    <div id="elem">
        E L E M E N T S
    </div>

    <div class="login">
        <h1>
            USER LOGIN
        </h1>
        <hr>
        <div>
            <form action="submission">
                <input type="text" id="Name" name="Name" placeholder="👨  Username" required>
            </form>
        </div>
        <br>
        <div id="pass">
            <form action="pass">
                <input type="password" id="pass" name="pass" placeholder="🔓 password">
            </form>
        </div>
        <div class="remember">
            <input class="remeber" type="checkbox" id="remember" name="remember"
                style="height: 15px; position:relative; left:-160px;bottom:-29px;">
            <label for="remember">Remember Me</label>
        </div>
        <div id="forgot">
            <h1>forget password?</h1>
        </div>
        <div class="butt">
            <form action="submit">
                <button>Sign in</button>
            </form>
        </div>

    </div>
</body>

</html>
